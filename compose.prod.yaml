services:
  mysql:
    image: mysql:8.0
    container_name: portfolio-mysql-prod
    # restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portfolio-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    container_name: portfolio-backend-prod
    # restart: always
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - portfolio-network
    volumes:
      - ./apps/backend/public:/var/www/html/public

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_SERVER_HOST: ${NEXT_SERVER_HOST}

    container_name: portfolio-frontend-prod
    # restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_SERVER_HOST: ${NEXT_SERVER_HOST}
    networks:
      - portfolio-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile.prod
    container_name: portfolio-nginx-prod
    # restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./apps/backend/public:/var/www/html/public:ro
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  mysql-data-prod:
